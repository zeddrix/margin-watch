name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed for the frozen-test check
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install Python 3.12 and dependencies
        working-directory: agent
        run: uv sync --frozen --python 3.12
      - name: Ruff
        working-directory: agent
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (strict)
        working-directory: agent
        run: uv run mypy --strict margin_watch
      - name: Pytest with coverage
        working-directory: agent
        run: |
          uv run pytest -q
          uv run coverage report --include="margin_watch/calc.py,margin_watch/status.py,margin_watch/validate.py" --fail-under=100
      - name: Test integrity
        run: |
          python3 scripts/check_test_integrity.py
          python3 scripts/check_frozen_tests.py

  dashboard:
    name: Dashboard (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm run test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          retention-days: 7
